    <script>
      // Apply the saved (or system) colour theme before first paint so there
      // is no flash of the wrong theme while the app bundle loads.
      (function () {
        try {
          var t = localStorage.getItem('partner-portal-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <style>
      /* First-paint splash. Lives inside #root and is discarded the moment
         React renders into the container — no JS needed to remove it. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f6f6fb;
      }
      html.dark #app-splash {
        background: #0f0e17;
      }
      #app-splash img {
        width: 132px;
        height: auto;
        opacity: 0;
        animation: splash-fade 0.5s ease-out 0.05s forwards;
      }
      #app-splash .spinner {
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        border: 2.5px solid rgba(124, 58, 237, 0.2);
        border-top-color: #7c3aed;
        animation: splash-spin 0.7s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img,
        #app-splash .spinner {
          animation: none;
          opacity: 1;
        }
      }
    </style>
